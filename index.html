<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f0f4f8;
            font-family: Arial, sans-serif;
        }

        .card {
            border: none;
            border-radius: 15px;
        }

        h2 {
            color: #0d6efd;
        }

        #result {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 450px;">
            <h2 class="text-center mb-4">BMI Calculator</h2>

            <label for="weight" class="form-label">Weight (kg)</label>
            <input type="number" id="weight" class="form-control mb-3"
                   placeholder="Enter your weight">

            <label for="height" class="form-label">Height (cm)</label>
            <input type="number" id="height" class="form-control mb-3"
                   placeholder="Enter your height">

            <button class="btn btn-primary w-100" onclick="calculateBMI()">
                Calculate BMI
            </button>

            <div id="result" class="text-center mt-4"></div>
        </div>
    </div>

    <script>
        function calculateBMI() {
            // Get the values from the inputs
            let weight = Number(document.querySelector('#weight').value);
            let height = Number(document.querySelector('#height').value);

            // Check if the inputs are valid
            if (weight <= 0 || height <= 0) {
                document.querySelector('#result').innerHTML =
                    "Please enter a valid weight and height.";
                return;
            }

            // Convert height from centimetres to metres
            height = height / 100;

            // Calculate BMI
            let bmi = weight / (height * height);

            // Determine the BMI category
            let category;

            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi < 25) {
                category = "Normal weight";
            } else if (bmi < 30) {
                category = "Overweight";
            } else {
                category = "Obese";
            }

            // Display the result
            document.querySelector('#result').innerHTML =
                "Your BMI is: " + bmi.toFixed(1) +
                "<br>Category: " + category;
        }
    </script>
</body>
</html>
